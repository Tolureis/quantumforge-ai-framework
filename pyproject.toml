[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quantumforge-ai"
version = "1.2.5"
description = "Backend-independent Quantum AI simulation and hybrid-model framework for Qiskit and PennyLane."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "QuantumForge AI Contributors" }]
keywords = ["quantum", "qml", "qiskit", "pennylane", "pytorch", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
qiskit = [
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<1",
  "qiskit-machine-learning>=0.9,<1",
]
pennylane = [
  "pennylane>=0.40,<0.46",
  "pennylane-lightning>=0.40,<0.46",
  # The PennyLane quantum-kernel route builds an sklearn SVC, and its
  # MissingDependencyError tells the user to install this very extra.  Without
  # scikit-learn here that instruction was a loop: installing [pennylane]
  # produced the same error again.  (The Qiskit route gets scikit-learn
  # transitively through qiskit-machine-learning.)
  #
  # The range deliberately still admits 1.11, where ``SVC.probability`` is
  # removed (deprecated in 1.9).  ``PennyLaneQSVC`` reads its hyper-parameter
  # list from ``SVC._get_param_names()`` instead of restating it, so it
  # advertises exactly what the installed version has and the removal cannot
  # break construction.  Pinning below 1.11 would have hidden the defect rather
  # than fixed it.
  "scikit-learn>=1.3,<2",
]
interop = [
  "pennylane-qiskit>=0.43,<0.44",
]
torch = ["torch>=2.2,<3"]
tracking = ["mlflow>=2.18,<4"]
automl = ["optuna>=4.0,<5"]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0",
]
all = [
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<1",
  "qiskit-machine-learning>=0.9,<1",
  "pennylane>=0.40,<0.46",
  "pennylane-lightning>=0.40,<0.46",
  "pennylane-qiskit>=0.43,<0.44",
  "scikit-learn>=1.3,<2",
  "torch>=2.2,<3",
  "mlflow>=2.18,<4",
  "optuna>=4.0,<5",
]

[project.scripts]
qforge = "qforge_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qforge_ai"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/IMPROVEMENT_REPORT_TR.md",
  "/RELEASE_NOTES_1.2.0_TR.md",
  "/RELEASE_NOTES_1.2.1_TR.md",
  "/MIGRATION_1.2.1_TR.md",
  "/TEST_REPORT.md",
  "/FIX_REPORT_1.2.2_TR.md",
  "/FIX_REPORT_1.2.3_TR.md",
  "/FIX_REPORT_1.2.4_TR.md",
  "/FIX_REPORT_1.2.5_TR.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/NOTICE",
  "/CITATION.cff",
  "/Dockerfile",
  "/.github",
  "/.gitignore",
  "/pyproject.toml",
  "/coverage-focus.ini",
]
exclude = [
  "/dist",
  "/build",
  "/.pytest_cache",
  "/.mypy_cache",
  "/.ruff_cache",
  "/.coverage",
  "**/__pycache__",
  "**/*.py[cod]",
  "**/*.egg-info",
  "**/*.egg-info/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
disable_error_code = ["misc", "name-defined", "override", "untyped-decorator"]

# Every engine integration lives behind an optional extra, and the ``core`` CI
# job installs only ``[dev]``.  Without these overrides ``mypy src/qforge_ai``
# failed in that job purely because torch (and any other optional package) was
# not installed -- a type check reporting a packaging fact rather than a typing
# one, and enough on its own to keep the workflow from being green.
[[tool.mypy.overrides]]
module = [
  "torch.*",
  "qiskit.*",
  "qiskit_aer.*",
  "qiskit_machine_learning.*",
  "pennylane.*",
  "sklearn.*",
  "mlflow.*",
  "optuna.*",
]
ignore_missing_imports = true
